<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>SocietyOS — Membership Setup</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800;900&family=Inter:wght@300;400;500;600&display=swap');
        :root {
            --bg-primary: #0d1f2d;
            --bg-secondary: #122844;
            --bg-elevated: #1a3358;
            --bg-card: #152a45;
            --border-subtle: rgba(255, 255, 255, 0.06);
            --border-glow: rgba(197, 160, 89, 0.3);
            --society-gold: #c5a059;
            --society-gold-light: #e5c585;
            --society-gold-glow: rgba(197, 160, 89, 0.15);
            --society-gold-2: #c5a059;
            --society-gold-light-2: #e5c585;
            --society-gold-glow-2: rgba(197, 160, 89, 0.15);
            --accent-green: #2a8a5e;
            --society-green-glow: rgba(27, 94, 62, 0.2);
            --success: #2dd4a8;
            --text-primary: #f0f0f5;
            --text-secondary: #a0a0b8;
            --text-tertiary: #6a6a82;
            --transition: 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            --transition-slow: 0.8s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'SF Pro Display', 'Inter', -apple-system, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
        }

        /* Ambient glow */
        body::before {
            content: '';
            position: fixed;
            top: -20%; left: -10%;
            width: 60%; height: 60%;
            background: radial-gradient(circle, rgba(30, 61, 89, 0.2) 0%, transparent 60%);
            filter: blur(80px);
            z-index: 0;
            pointer-events: none;
        }
        body::after {
            content: '';
            position: fixed;
            bottom: -20%; right: -10%;
            width: 50%; height: 50%;
            background: radial-gradient(circle, rgba(27, 94, 62, 0.2) 0%, transparent 60%);
            filter: blur(80px);
            z-index: 0;
            pointer-events: none;
        }

        .container {
            position: relative;
            z-index: 1;
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Header */
        .header {
            text-align: center;
            margin-bottom: 2rem;
        }
        .header h1 {
            font-size: 2rem;
            font-weight: 700;
            letter-spacing: -0.02em;
            margin-bottom: 0.5rem;
        }
        .header h1 .gradient {
            background: linear-gradient(135deg, var(--society-gold-light), var(--accent-green));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .header p {
            color: var(--text-secondary);
            font-size: 0.95rem;
        }

        /* Progress steps */
        .steps {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 0.5rem;
            margin-bottom: 3rem;
        }
        .step {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        .step-dot {
            width: 32px; height: 32px;
            border-radius: 50%;
            border: 2px solid var(--border-subtle);
            display: flex; align-items: center; justify-content: center;
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--text-tertiary);
            transition: var(--transition);
        }
        .step.active .step-dot {
            border-color: var(--society-gold);
            background: var(--society-gold-glow);
            color: var(--society-gold-light);
            box-shadow: 0 0 20px var(--society-gold-glow);
        }
        .step.completed .step-dot {
            background: var(--society-gold);
            border-color: var(--society-gold);
            color: white;
        }
        .step.skipped .step-dot {
            border-color: var(--border-subtle);
            background: transparent;
            color: var(--text-tertiary);
            opacity: 0.4;
            text-decoration: line-through;
        }
        .step.skipped .step-label {
            opacity: 0.35;
            text-decoration: line-through;
        }
        .step-label {
            font-size: 0.85rem;
            color: var(--text-tertiary);
            transition: var(--transition);
        }
        .step.active .step-label {
            color: var(--text-primary);
        }
        .step-line {
            width: 40px; height: 2px;
            background: var(--border-subtle);
            transition: var(--transition);
        }
        .step-line.completed {
            background: var(--society-gold);
        }

        /* Main content area */
        .content {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        /* Stage area — where the morphing happens */
        .stage {
            width: 100%;
            max-width: 800px;
            min-height: 420px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        /* The AI Bubble — the morphing element */
        .ai-bubble {
            width: 180px;
            height: 180px;
            border-radius: 50%;
            background: radial-gradient(circle at 35% 35%,
                rgba(168, 112, 255, 0.3) 0%,
                rgba(197, 160, 89, 0.15) 50%,
                rgba(10, 10, 15, 0.8) 100%);
            border: 1px solid var(--border-glow);
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.8s cubic-bezier(0.34, 1.56, 0.64, 1);
            box-shadow:
                0 0 60px var(--society-gold-glow),
                inset 0 0 40px rgba(197, 160, 89, 0.08);
            animation: float 4s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px) scale(1); }
            50% { transform: translateY(-12px) scale(1.02); }
        }

        /* Inner orb pulse */
        .ai-bubble::before {
            content: '';
            position: absolute;
            width: 60%; height: 60%;
            border-radius: 50%;
            background: radial-gradient(circle, var(--society-gold-glow) 0%, transparent 70%);
            animation: pulse-inner 3s ease-in-out infinite;
        }

        @keyframes pulse-inner {
            0%, 100% { opacity: 0.4; transform: scale(1); }
            50% { opacity: 0.8; transform: scale(1.1); }
        }

        /* The S in the bubble */
        .ai-bubble-mark {
            width: 72px; height: 72px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--society-gold), var(--society-gold-2));
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            font-weight: 800;
            color: white;
            z-index: 2;
            transition: all 0.8s cubic-bezier(0.34, 1.56, 0.64, 1);
            box-shadow: 0 4px 20px var(--society-gold-glow);
        }

        /* Morphed states */
        .ai-bubble.morphed-phone {
            width: 200px;
            height: 100px;
            border-radius: 24px;
            animation: none;
        }
        .ai-bubble.morphed-phone .ai-bubble-mark {
            width: 40px; height: 40px;
            font-size: 1.2rem;
        }

        .ai-bubble.morphed-case {
            width: 220px;
            height: 110px;
            border-radius: 28px;
            animation: none;
        }

        /* Orbiting particles */
        .orbit-container {
            position: absolute;
            width: 280px;
            height: 280px;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
        }
        .orbit-particle {
            position: absolute;
            width: 6px; height: 6px;
            border-radius: 50%;
            background: var(--accent-green);
            box-shadow: 0 0 8px var(--accent-green);
            top: 50%; left: 50%;
        }
        .orbit-particle:nth-child(1) { animation: orbit 6s linear infinite; }
        .orbit-particle:nth-child(2) { animation: orbit 8s linear infinite reverse; }
        .orbit-particle:nth-child(3) { animation: orbit 10s linear infinite; }

        @keyframes orbit {
            from { transform: translate(-50%, -50%) rotate(0deg) translateX(130px) rotate(0deg); }
            to { transform: translate(-50%, -50%) rotate(360deg) translateX(130px) rotate(-360deg); }
        }

        /* Selection prompt */
        .stage-prompt {
            font-size: 1.3rem;
            font-weight: 600;
            margin-top: 2rem;
            margin-bottom: 0.5rem;
            text-align: center;
            transition: opacity 0.4s;
        }
        .stage-subtitle {
            color: var(--text-secondary);
            font-size: 0.95rem;
            text-align: center;
            margin-bottom: 2rem;
        }

        /* Selection grid */
        .selection-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
            gap: 1rem;
            width: 100%;
            max-width: 800px;
        }

        .selection-card {
            background: var(--bg-card);
            border: 1px solid var(--border-subtle);
            border-radius: 16px;
            padding: 1.5rem 1rem 2.5rem;
            text-align: center;
            cursor: pointer;
            transition: var(--transition);
            position: relative;
            overflow: visible;
            min-height: 180px;

            /* Default state: visible, slightly dimmed */
            opacity: 0.85;
            filter: brightness(0.9) saturate(0.8);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.6);
        }
        .selection-card:hover,
        .selection-card.selected {
            overflow: visible;
        }
        .selection-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 2px;
            background: linear-gradient(90deg, var(--society-gold), var(--society-gold-2));
            transform: scaleX(0);
            transform-origin: left;
            transition: var(--transition);
        }

        /* Smokey glow aura on hover — the illumination */
        .selection-card::after {
            content: '';
            position: absolute;
            top: -2px; left: -2px; right: -2px; bottom: -2px;
            border-radius: 18px;
            background: linear-gradient(135deg,
                var(--society-gold-glow) 0%,
                transparent 40%,
                transparent 60%,
                var(--society-gold-glow-2) 100%);
            opacity: 0;
            transition: opacity 0.6s ease;
            pointer-events: none;
            z-index: -1;
        }

        .selection-card:hover {
            /* Illuminate from shadow */
            opacity: 1;
            filter: brightness(1) saturate(1);
            border-color: var(--border-glow);
            background: var(--bg-elevated);
            transform: translateY(-4px);

            /* Smokey light around the edge */
            box-shadow:
                0 0 0 1px var(--border-glow),
                0 0 20px rgba(197, 160, 89, 0.2),
                0 0 40px rgba(197, 160, 89, 0.1),
                0 0 60px rgba(197, 160, 89, 0.05),
                0 8px 30px rgba(0, 0, 0, 0.4);
        }
        .selection-card:hover::before { transform: scaleX(1); }
        .selection-card:hover::after { opacity: 1; }

        /* Animated smoke particles on hover */
        .selection-card:hover .smoke-layer {
            opacity: 1;
        }
        .smoke-layer {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            border-radius: 16px;
            overflow: hidden;
            opacity: 0;
            transition: opacity 0.8s ease;
            pointer-events: none;
        }        .smoke-particle {
            position: absolute;
            border-radius: 50%;
            filter: blur(8px);
            opacity: 0;
        }
        .selection-card:hover .smoke-particle {
            animation: smoke-drift 3s ease-out infinite;
        }
        .smoke-particle:nth-child(1) {
            width: 40px; height: 40px;
            background: rgba(197, 160, 89, 0.15);
            bottom: 10%; left: 10%;
            animation-delay: 0s !important;
        }
        .smoke-particle:nth-child(2) {
            width: 30px; height: 30px;
            background: rgba(197, 160, 89, 0.1);
            bottom: 15%; right: 15%;
            animation-delay: 0.8s !important;
        }
        .smoke-particle:nth-child(3) {
            width: 50px; height: 50px;
            background: rgba(42, 138, 94, 0.08);
            bottom: 5%; left: 40%;
            animation-delay: 1.5s !important;
        }

        @keyframes smoke-drift {
            0% { opacity: 0; transform: translateY(0) scale(0.5); }
            20% { opacity: 0.6; }
            100% { opacity: 0; transform: translateY(-80px) scale(1.5); }
        }

        /* Selected state — fully illuminated, persistent */
        .selection-card.selected {
            opacity: 1;
            filter: brightness(1) saturate(1);
            border-color: var(--society-gold);
            background: var(--bg-elevated);
            box-shadow:
                0 0 0 1px var(--society-gold),
                0 0 20px rgba(197, 160, 89, 0.25),
                0 0 40px rgba(197, 160, 89, 0.12),
                0 8px 30px rgba(0, 0, 0, 0.4);
        }
        .selection-card.selected::before { transform: scaleX(1); }
        .selection-card.selected::after { opacity: 0.5; }
        .selection-card.selected .smoke-layer { opacity: 1; }
        .selection-card.selected .smoke-particle { animation: smoke-drift 3s ease-out infinite; }

        .card-icon {
            font-size: 2.5rem;
            margin-bottom: 0.75rem;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 60px;
            color: var(--text-tertiary);
            transition: color 0.4s ease;
        }
        .card-icon svg {
            max-width: 56px;
            max-height: 48px;
        }
        .selection-card:hover .card-icon,
        .selection-card.selected .card-icon {
            color: var(--text-primary);
        }
        /* Brand-specific hover colors */
        .selection-card[data-id^="samsung"]:hover .card-icon,
        .selection-card[data-id^="samsung"].selected .card-icon {
            color: #1428a0;
        }
        .selection-card[data-id^="iphone"]:hover .card-icon,
        .selection-card[data-id^="iphone"].selected .card-icon,
        .selection-card[data-id^="mac-mini"]:hover .card-icon,
        .selection-card[data-id^="mac-mini"].selected .card-icon {
            color: var(--text-primary);
        }
        .selection-card[data-id^="motorola"]:hover .card-icon,
        .selection-card[data-id^="motorola"].selected .card-icon {
            color: #5c92fa;
        }
        .selection-card[data-id^="framework"]:hover .card-icon,
        .selection-card[data-id^="framework"].selected .card-icon {
            color: #2a8a5e;
        }
        .selection-card[data-id^="tangem"]:hover .card-icon,
        .selection-card[data-id^="tangem"].selected .card-icon {
            color: var(--accent-green);
        }
        .selection-card[data-id="founding-nodes"]:hover .card-icon,
        .selection-card[data-id="founding-nodes"].selected .card-icon {
            color: var(--society-gold-2);
        }
        /* Case silhouettes — visible by default, illuminate on hover */
        .case-silhouette {
            opacity: 0.6;
            transition: all 0.6s cubic-bezier(0.4, 0, 0.2, 1);
            pointer-events: none;
            position: absolute;
            top: 68%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.85);
        }
        /* Default phone shape — tall */
        .case-silhouette:not(.case-foldable-book):not(.case-foldable-horizontal) {
            width: 50px;
            height: 100px;
        }
        /* Foldable wide + horizontal — both landscape (Fold8 Wide + iPhone Ultra) */
        .case-foldable-horizontal,
        .case-foldable-wide-shape {
            width: 90px;
            height: 60px;
        }
        /* Foldable book tall — portrait (Fold8 Ultra, Motorola) */
        .case-foldable-book:not(.case-foldable-wide-shape) {
            width: 60px;
            height: 90px;
        }
        .selection-card:hover .case-silhouette,
        .selection-card.selected .case-silhouette {
            opacity: 1;
            transform: translate(-50%, -50%) scale(1);
        }        /* Case body — the outline of the case (works on rect and path) */
        .case-silhouette .case-body {
            fill: none;
            stroke: rgba(197, 160, 89, 0.2);
            stroke-width: 1.5;
            transition: all 0.6s ease;
        }
        .selection-card:hover .case-silhouette .case-body,
        .selection-card.selected .case-silhouette .case-body {
            stroke: var(--society-gold-light);
            stroke-width: 2;
            filter: drop-shadow(0 0 4px var(--society-gold-glow)) drop-shadow(0 0 8px var(--society-gold-glow));
        }
        /* Variants */
        .case-silhouette .case-body-thick {
            stroke-width: 2.5;
        }
        .case-silhouette .case-body-translucent {
            stroke: rgba(42, 138, 94, 0.2);
        }
        .selection-card:hover .case-silhouette .case-body-translucent {
            stroke: var(--accent-green);
            filter: drop-shadow(0 0 4px var(--society-green-glow)) drop-shadow(0 0 8px var(--society-green-glow));
        }
        .case-silhouette .case-body-ghost {
            stroke: rgba(255, 255, 255, 0.1);
            stroke-dasharray: 3 2;
        }
        .selection-card:hover .case-silhouette .case-body-ghost {
            stroke: rgba(255, 255, 255, 0.5);
            filter: drop-shadow(0 0 4px rgba(255, 255, 255, 0.2)) drop-shadow(0 0 8px rgba(255, 255, 255, 0.1));
        }
        .case-silhouette .case-body-inner {
            fill: none;
            stroke: rgba(197, 160, 89, 0.15);
            stroke-width: 1;
        }
        .selection-card:hover .case-silhouette .case-body-inner {
            stroke: rgba(168, 112, 255, 0.5);
        }
        /* Camera bump */
        .case-silhouette .case-camera {
            fill: rgba(0, 0, 0, 0.3);
            stroke: rgba(197, 160, 89, 0.15);
            stroke-width: 1;
            transition: all 0.6s ease;
        }
        .selection-card:hover .case-silhouette .case-camera {
            stroke: var(--society-gold-light);
            fill: rgba(197, 160, 89, 0.1);
            filter: drop-shadow(0 0 3px var(--society-gold-glow));
        }
        /* Edge lines */
        .case-silhouette .case-edge {
            stroke: rgba(197, 160, 89, 0.1);
            stroke-width: 1;
            transition: all 0.6s ease;
        }
        .selection-card:hover .case-silhouette .case-edge {
            stroke: var(--society-gold-light);
            stroke-width: 1.5;
            filter: drop-shadow(0 0 3px var(--society-gold-glow));
        }
        /* Detail lines (gradient) */
        .case-silhouette .case-detail {
            stroke: rgba(197, 160, 89, 0.1);
            stroke-width: 1;
            transition: all 0.6s ease;
        }
        .selection-card:hover .case-silhouette .case-detail {
            stroke: var(--society-gold-light-2);
            filter: drop-shadow(0 0 3px var(--society-gold-glow-2));
        }
        /* Detail dots (particle) */
        .case-silhouette .case-detail-dot {
            fill: rgba(42, 138, 94, 0.1);
            transition: all 0.6s ease;
        }
        .selection-card:hover .case-silhouette .case-detail-dot {
            fill: var(--accent-green);
            filter: drop-shadow(0 0 2px var(--society-green-glow));
        }
        /* Stitch lines (leather) */
        .case-silhouette .case-stitch {
            stroke: rgba(197, 160, 89, 0.1);
            stroke-width: 0.5;
            stroke-dasharray: 2 2;
            transition: all 0.6s ease;
        }
        .selection-card:hover .case-silhouette .case-stitch {
            stroke: var(--society-gold-light-2);
            filter: drop-shadow(0 0 2px var(--society-gold-glow-2));
        }
        /* Glow lines (frosted) */
        .case-silhouette .case-glow-line {
            stroke: rgba(42, 138, 94, 0.05);
            stroke-width: 1;
            transition: all 0.6s ease;
        }
        .selection-card:hover .case-silhouette .case-glow-line {
            stroke: var(--accent-green);
            filter: drop-shadow(0 0 3px var(--society-green-glow)) drop-shadow(0 0 6px var(--society-green-glow));
        }
        /* Glow circle (ghost) */
        .case-silhouette .case-glow-circle {
            fill: rgba(255, 255, 255, 0.03);
            stroke: rgba(255, 255, 255, 0.08);
            stroke-width: 1;
            transition: all 0.6s ease;
        }
        .selection-card:hover .case-silhouette .case-glow-circle {
            fill: rgba(255, 255, 255, 0.08);
            stroke: rgba(255, 255, 255, 0.3);
            filter: drop-shadow(0 0 4px rgba(255, 255, 255, 0.2));
        }
        /* Vent holes (rugged) */
        .case-silhouette .case-vent {
            fill: rgba(0, 0, 0, 0.3);
            stroke: rgba(197, 160, 89, 0.1);
            stroke-width: 0.5;
            transition: all 0.6s ease;
        }
        .selection-card:hover .case-silhouette .case-vent {
            stroke: var(--society-gold-light);
            fill: rgba(197, 160, 89, 0.2);
            filter: drop-shadow(0 0 2px var(--society-gold-glow));
        }
        /* Crease (foldable) */
        .case-silhouette .case-crease {
            stroke: rgba(197, 160, 89, 0.1);
            stroke-width: 1;
            stroke-dasharray: 3 2;
            transition: all 0.6s ease;
        }
        .selection-card:hover .case-silhouette .case-crease,
        .selection-card.selected .case-silhouette .case-crease {
            stroke: var(--society-gold-light);
            filter: drop-shadow(0 0 3px var(--society-gold-glow));
            opacity: 0.3;
        }

        /* Foldable book — left/right halves slide apart on hover (applies to both tall and wide) */
        .case-foldable-book {
            overflow: visible !important;
        }
        .case-foldable-book .fold-left,
        .case-foldable-book .fold-right {
            transition: transform 0.8s cubic-bezier(0.34, 1.56, 0.64, 1);
            transform-box: fill-box;
        }
        .selection-card:hover .case-foldable-book .fold-left {
            transform: translate(-6px, 0);
        }
        .selection-card:hover .case-foldable-book .fold-right {
            transform: translate(6px, 0);
        }
        .selection-card.selected .case-foldable-book .fold-left {
            transform: translate(-4px, 0);
        }
        .selection-card.selected .case-foldable-book .fold-right {
            transform: translate(4px, 0);
        }

        /* Foldable horizontal — top/bottom halves slide apart on hover (iPhone Ultra) */
        .case-foldable-horizontal {
            overflow: visible !important;
        }
        .case-foldable-horizontal .fold-top,
        .case-foldable-horizontal .fold-bottom {
            transition: transform 0.8s cubic-bezier(0.34, 1.56, 0.64, 1);
            transform-box: fill-box;
        }
        .selection-card:hover .case-foldable-horizontal .fold-top {
            transform: translate(0, -5px);
        }
        .selection-card:hover .case-foldable-horizontal .fold-bottom {
            transform: translate(0, 5px);
        }
        .selection-card.selected .case-foldable-horizontal .fold-top {
            transform: translate(0, -3px);
        }
        .selection-card.selected .case-foldable-horizontal .fold-bottom {
            transform: translate(0, 3px);
        }

        .card-title {
            font-size: 0.95rem;
            font-weight: 600;
            margin-bottom: 0.25rem;
        }
        .card-subtitle {
            font-size: 0.8rem;
            color: var(--text-tertiary);
        }

        /* Device render area */
        .device-render {
            margin-top: 2rem;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 200px;
            position: relative;
        }

        /* ── Step 2 split layout: case grid + live phone preview ── */
        .step2-layout {
            display: flex;
            gap: 2rem;
            width: 100%;
            max-width: 1000px;
            align-items: flex-start;
            justify-content: center;
        }
        .step2-grid-side { flex: 1; min-width: 0; }
        .step2-grid-side.has-single-case .selection-grid {
            grid-template-columns: 1fr;
            max-width: 340px;
            margin: 0 auto;
        }
        .step2-grid-side.has-single-case .selection-card {
            min-height: 220px;
            padding: 2rem 1.5rem 3rem;
        }
        .step2-grid-side.has-single-case .selection-card .card-title {
            font-size: 1.15rem;
        }
        .step2-grid-side.has-single-case .selection-card .card-subtitle {
            font-size: 0.88rem;
        }
        .step2-grid-side.has-single-case .selection-card .case-silhouette {
            transform: translate(-50%, -50%) scale(1.15);
        }
        .step2-grid-side.has-single-case .selection-card:hover .case-silhouette,
        .step2-grid-side.has-single-case .selection-card.selected .case-silhouette {
            transform: translate(-50%, -50%) scale(1.3);
        }
        .step2-preview-side {
            width: 300px;
            flex-shrink: 0;
            position: sticky;
            top: 1rem;
        }
        .case-preview-panel {
            background: var(--bg-card);
            border: 1px solid var(--border-subtle);
            border-radius: 20px;
            padding: 1.5rem 1.25rem 2rem;
            text-align: center;
            transition: var(--transition);
        }
        .case-preview-panel.has-case {
            border-color: var(--border-glow);
            box-shadow: 0 0 20px var(--society-gold-glow);
        }
        .case-preview-phone-label {
            font-size: 0.7rem;
            color: var(--text-tertiary);
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-bottom: 0.25rem;
        }
        .case-preview-phone-name {
            font-size: 0.95rem;
            font-weight: 600;
            margin-bottom: 1.5rem;
        }
        .case-preview-device-area {
            min-height: 340px;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }
        .case-preview-info {
            margin-top: 1.5rem;
            padding-top: 1rem;
            border-top: 1px solid var(--border-subtle);
            min-height: 80px;
        }
        .case-preview-case-name {
            font-size: 0.95rem;
            font-weight: 600;
            color: var(--society-gold-light);
            margin-bottom: 0.25rem;
        }
        .case-preview-lifestyle {
            font-size: 0.78rem;
            color: var(--text-tertiary);
            margin-bottom: 0.5rem;
        }
        .case-preview-price {
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--society-gold-light-2);
        }
        .case-preview-hint {
            font-size: 0.72rem;
            color: var(--text-tertiary);
            font-style: italic;
            margin-top: 0.5rem;
        }

        /* Color swatches */
        .color-swatches {
            display: flex;
            justify-content: center;
            gap: 0.5rem;
            margin-top: 0.75rem;
        }
        .color-swatch {
            width: 22px; height: 22px;
            border-radius: 50%;
            border: 2px solid var(--border-subtle);
            cursor: pointer;
            transition: all 0.3s;
        }
        .color-swatch:hover { transform: scale(1.15); border-color: var(--society-gold-light); }
        .color-swatch.selected {
            border-color: var(--society-gold);
            box-shadow: 0 0 10px var(--society-gold-glow);
            transform: scale(1.1);
        }

        /* ── Realistic case wrap materials ── */
        .case-wrap {
            position: absolute;
            top: -8px; left: -8px; right: -8px; bottom: -8px;
            border-radius: 26px;
            pointer-events: none;
            transition: all 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
            overflow: hidden;
        }
        /* The detailed SVG case design overlaying the phone */
        .case-wrap svg.case-design {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            border-radius: inherit;
        }
        /* Foldable case wrap adjustments */
        .phone-mockup.foldable-interactive .case-wrap {
            border-radius: 16px;
            top: -6px; left: -6px; right: -6px; bottom: -6px;
        }


        /* Phone render */
        .phone-mockup {
            width: 140px;
            height: 280px;
            border-radius: 20px;
            background: linear-gradient(145deg, #1a1a2e, #0d0d12);
            border: 2px solid var(--border-glow);
            position: relative;
            transition: all 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5), 0 0 40px var(--society-gold-glow);
        }
        .phone-mockup::before {
            content: '';
            position: absolute;
            top: 8px; left: 50%;
            transform: translateX(-50%);
            width: 60px; height: 6px;
            border-radius: 3px;
            background: var(--border-subtle);
        }
        .phone-mockup.screen-on::after {
            content: '';
            position: absolute;
            top: 24px; left: 8px; right: 8px; bottom: 8px;
            border-radius: 12px;
            background: linear-gradient(135deg, rgba(197, 160, 89, 0.1), rgba(197, 160, 89, 0.05));
            border: 1px solid var(--border-subtle);
        }

        /* Foldable phone — book style (tall) */
        .phone-mockup.foldable {
            width: 200px;
            height: 260px;
            border-radius: 12px;
        }
        .phone-mockup.foldable::before {
            content: '';
            position: absolute;
            top: 0; left: 50%;
            width: 2px; height: 100%;
            background: var(--border-subtle);
            transform: translateX(-50%);
        }

        /* Foldable phone — wide style (landscape) */
        .phone-mockup.foldable-wide {
            width: 260px;
            height: 200px;
            border-radius: 12px;
        }
        .phone-mockup.foldable-wide::before {
            content: '';
            position: absolute;
            top: 50%; left: 0;
            width: 100%; height: 2px;
            background: var(--border-subtle);
            transform: translateY(-50%);
        }

        /* Foldable phone — horizontal fold (SAME SIZE as foldable-wide, horizontal crease) */
        .phone-mockup.foldable-horizontal {
            width: 260px;
            height: 200px;
            border-radius: 12px;
        }
        .phone-mockup.foldable-horizontal::before {
            content: '';
            position: absolute;
            top: 50%; left: 0;
            width: 100%; height: 2px;
            background: var(--border-subtle);
            transform: translateY(-50%);
        }

        /* Interactive foldable mockup — halves that open and close on tap */
        .phone-mockup.foldable-interactive {
            cursor: pointer;
            overflow: visible;
            border: 1px solid var(--border-subtle);
            background: linear-gradient(135deg, #0a0a1a 0%, #111122 100%);
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .phone-mockup.foldable-interactive::before {
            display: none;
        }

        /* Fold halves — shared */
        .fold-half {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.8s cubic-bezier(0.34, 1.56, 0.64, 1);
            position: relative;
            overflow: hidden;
            background: linear-gradient(135deg, #0c0c20 0%, #141430 100%);
        }

        /* Book fold — left/right */
        .phone-mockup.foldable-interactive.foldable,
        .phone-mockup.foldable-interactive.foldable-wide {
            flex-direction: row;
        }
        .fold-left-half {
            border-radius: 12px 0 0 12px;
            border-right: 1px solid var(--border-subtle);
        }
        .fold-right-half {
            border-radius: 0 12px 12px 0;
            border-left: 1px solid var(--border-subtle);
        }

        /* Horizontal fold — top/bottom */
        .phone-mockup.foldable-interactive.foldable-horizontal {
            flex-direction: column;
        }
        .fold-top-half {
            border-radius: 12px 12px 0 0;
            border-bottom: 1px solid var(--border-subtle);
        }
        .fold-bottom-half {
            border-radius: 0 0 12px 12px;
            border-top: 1px solid var(--border-subtle);
        }

        /* Screen content — glowing accent */
        .fold-screen {
            width: 80%;
            height: 80%;
            border-radius: 4px;
            background: linear-gradient(135deg,
                rgba(197, 160, 89, 0.06) 0%,
                rgba(197, 160, 89, 0.03) 100%);
            border: 1px solid rgba(197, 160, 89, 0.08);
            transition: all 0.8s ease;
        }

        /* Crease line */
        .fold-crease-line {
            position: absolute;
            background: var(--border-subtle);
            transition: all 0.8s ease;
            opacity: 0.5;
        }
        .fold-crease-vertical {
            width: 1px;
            height: 100%;
            top: 0; left: 50%;
            transform: translateX(-50%);
        }
        .fold-crease-horizontal {
            width: 100%;
            height: 1px;
            left: 0; top: 50%;
            transform: translateY(-50%);
        }

        /* CLOSED state — halves overlap (compact phone) */
        .phone-mockup.foldable-interactive.fold-closed .fold-left-half {
            transform: translateX(0);
            border-radius: 12px;
            z-index: 2;
            opacity: 1;
        }
        .phone-mockup.foldable-interactive.fold-closed .fold-right-half {
            transform: translateX(0);
            border-radius: 12px;
            z-index: 1;
            opacity: 0.3;
        }
        .phone-mockup.foldable-interactive.fold-closed .fold-top-half {
            transform: translateY(0);
            border-radius: 12px;
            z-index: 2;
            opacity: 1;
        }
        .phone-mockup.foldable-interactive.fold-closed .fold-bottom-half {
            transform: translateY(0);
            border-radius: 12px;
            z-index: 1;
            opacity: 0.3;
        }
        .phone-mockup.foldable-interactive.fold-closed .fold-crease-line {
            opacity: 0.2;
        }
        .phone-mockup.foldable-interactive.fold-closed .fold-screen {
            opacity: 0.4;
        }

        /* OPEN state — halves slide apart */
        .phone-mockup.foldable-interactive.fold-open .fold-left-half {
            transform: translateX(-15px);
            border-radius: 12px 0 0 12px;
            opacity: 1;
        }
        .phone-mockup.foldable-interactive.fold-open .fold-right-half {
            transform: translateX(15px);
            border-radius: 0 12px 12px 0;
            opacity: 1;
        }
        .phone-mockup.foldable-interactive.fold-open .fold-top-half {
            transform: translateY(-12px);
            border-radius: 12px 12px 0 0;
            opacity: 1;
        }
        .phone-mockup.foldable-interactive.fold-open .fold-bottom-half {
            transform: translateY(12px);
            border-radius: 0 0 12px 12px;
            opacity: 1;
        }
        .phone-mockup.foldable-interactive.fold-open .fold-crease-line {
            opacity: 0.8;
            background: var(--society-gold-light);
            box-shadow: 0 0 4px var(--society-gold-glow);
        }
        .phone-mockup.foldable-interactive.fold-open .fold-screen {
            opacity: 1;
            border-color: rgba(197, 160, 89, 0.2);
        }

        /* Fold hint text */
        .fold-hint {
            position: absolute;
            bottom: -28px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 0.75rem;
            color: var(--text-tertiary);
            white-space: nowrap;
            transition: all 0.3s ease;
        }

        /* Case on phone */
        .case-overlay {
            position: absolute;
            top: -4px; left: -4px; right: -4px; bottom: -4px;
            border-radius: 24px;
            border: 3px solid;
            transition: all 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
            pointer-events: none;
        }
        .case-overlay.magsafe {
            border-color: var(--society-gold-2);
            box-shadow: 0 0 30px var(--society-gold-glow-2), inset 0 0 20px var(--society-gold-glow-2);
        }
        .case-overlay.magsafe::before {
            content: '';
            position: absolute;
            top: 40px; left: 50%;
            transform: translateX(-50%);
            width: 30px; height: 30px;
            border-radius: 50%;
            border: 2px solid var(--society-gold-2);
            opacity: 0.6;
        }
        .case-overlay.clear {
            border-color: rgba(42, 138, 94, 0.3);
            background: rgba(42, 138, 94, 0.03);
            backdrop-filter: blur(2px);
        }
        .case-overlay.leather {
            border-color: #4a3a2a;
            background: linear-gradient(135deg, rgba(74, 58, 42, 0.2), rgba(50, 38, 28, 0.1));
        }
        .case-overlay.raven-gold {
            border-color: var(--society-gold-2);
            background: linear-gradient(135deg, rgba(197, 160, 89, 0.1), rgba(184, 144, 47, 0.05));
            box-shadow: 0 0 30px var(--society-gold-glow-2);
        }

        /* Action button */
        .action-bar {
            display: flex;
            justify-content: center;
            gap: 1rem;
            margin-top: 2rem;
            padding-bottom: 2rem;
        }
        .btn {
            font-family: inherit;
            font-weight: 600;
            font-size: 0.95rem;
            padding: 0.75rem 2rem;
            border-radius: 12px;
            border: none;
            cursor: pointer;
            transition: var(--transition);
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
        }
        .btn-primary {
            background: linear-gradient(135deg, var(--society-gold), #6d3df0);
            color: white;
            box-shadow: 0 4px 20px var(--society-gold-glow);
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 30px var(--society-gold-glow);
        }
        .btn-primary:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            transform: none;
        }
        .btn-ghost {
            background: transparent;
            color: var(--text-secondary);
            border: 1px solid var(--border-subtle);
        }
        .btn-ghost:hover {
            color: var(--text-primary);
            border-color: var(--border-glow);
        }
        .btn-gold {
            background: linear-gradient(135deg, var(--society-gold-2), #b8902f);
            color: #1a1a1a;
            box-shadow: 0 4px 20px var(--society-gold-glow-2);
        }

        /* Summary panel */
        .summary {
            display: none;
            background: var(--bg-card);
            border: 1px solid var(--border-glow);
            border-radius: 20px;
            padding: 2rem;
            margin-top: 2rem;
            max-width: 500px;
            width: 100%;
        }
        .summary.visible {
            display: block;
            animation: slideUp 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .summary-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.75rem 0;
            border-bottom: 1px solid var(--border-subtle);
        }
        .summary-row:last-child { border-bottom: none; }
        .summary-label {
            color: var(--text-secondary);
            font-size: 0.9rem;
        }
        .summary-value {
            font-weight: 600;
            font-size: 0.95rem;
        }

        /* NFC tap animation */
        .nfc-pulse {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 120px; height: 120px;
            border-radius: 50%;
            border: 2px solid var(--accent-green);
            opacity: 0;
            pointer-events: none;
        }
        .nfc-pulse.active {
            animation: nfc-tap 1.5s ease-out;
        }
        @keyframes nfc-tap {
            0% { opacity: 1; transform: translate(-50%, -50%) scale(0.5); }
            100% { opacity: 0; transform: translate(-50%, -50%) scale(2.5); }
        }

        /* Responsive */
        @media (max-width: 768px) {
            .container { padding: 1rem; }
            .header h1 { font-size: 1.5rem; }
            .selection-grid { grid-template-columns: repeat(2, 1fr); }
            .step-label { display: none; }
        }

        /* Case card product image — clean, single image */
        .case-card-image {
            width: 100%;
            max-width: 120px;
            aspect-ratio: 3/4;
            margin: 0 auto 0.5rem;
            border-radius: 10px;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.06);
            transition: all 0.4s ease;
        }
        .case-card-image img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            border-radius: 10px;
            opacity: 0.75;
            transition: all 0.4s ease;
            padding: 4px;
        }
        .selection-card:hover .case-card-image,
        .selection-card.selected .case-card-image {
            border-color: var(--border-glow);
            box-shadow: 0 0 12px var(--society-gold-glow);
        }
        .selection-card:hover .case-card-image img,
        .selection-card.selected .case-card-image img {
            opacity: 1;
        }
        .selection-card:has(.case-card-image) .case-silhouette { display: none; }

        /* Case preview — morphing phone→case transition */
        .case-preview-device-area {
            min-height: 380px;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow: visible;
        }
        
        /* The morphing container — holds both phone and case image */
        .morph-stage {
            position: relative;
            width: 160px;
            height: 320px;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: all 0.8s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        
        /* Phone layer — visible initially, fades/scales when case selected */
        .morph-phone {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(1);
            opacity: 1;
            transition: all 0.8s cubic-bezier(0.34, 1.56, 0.64, 1);
            z-index: 2;
        }
        .morph-phone.morphing-out {
            transform: translate(-50%, -50%) scale(0.3) rotateY(90deg);
            opacity: 0;
        }
        
        /* Case product image layer — hidden initially, morphs in */
        .morph-case {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.3) rotateY(-90deg);
            opacity: 0;
            transition: all 0.8s cubic-bezier(0.34, 1.56, 0.64, 1);
            z-index: 1;
            width: 180px;
            border-radius: 16px;
            overflow: hidden;
            background: rgba(255,255,255,0.02);
        }
        .morph-case.morphing-in {
            transform: translate(-50%, -50%) scale(1) rotateY(0deg);
            opacity: 1;
            z-index: 3;
        }
        .morph-case img {
            width: 100%;
            height: auto;
            display: block;
            object-fit: contain;
            border-radius: 16px;
        }
        
        /* Morph flash effect */
        .morph-flash {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0);
            width: 200px;
            height: 400px;
            border-radius: 30px;
            background: radial-gradient(circle, var(--society-gold-glow) 0%, transparent 70%);
            opacity: 0;
            z-index: 10;
            pointer-events: none;
        }
        .morph-flash.active {
            animation: morph-flash-anim 0.8s ease-out;
        }
        @keyframes morph-flash-anim {
            0% { transform: translate(-50%, -50%) scale(0); opacity: 0; }
            40% { transform: translate(-50%, -50%) scale(1); opacity: 0.8; }
            100% { transform: translate(-50%, -50%) scale(1.5); opacity: 0; }
        }
        
        /* Colorway change — smooth image swap */
        .morph-case img {
            transition: opacity 0.4s ease, filter 0.4s ease;
        }
        .morph-case img.swapping {
            opacity: 0.3;
        }
        
        /* LOCKED — disable all hover effects after case is selected */
        .selection-grid.case-locked .selection-card:hover {
            opacity: 0.85;
            filter: brightness(0.9) saturate(0.8);
            border-color: var(--border-subtle);
            background: var(--bg-card);
            transform: none;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.6);
        }
        .selection-grid.case-locked .selection-card:hover::before {
            transform: scaleX(0);
        }
        .selection-grid.case-locked .selection-card:hover::after {
            opacity: 0;
        }
        .selection-grid.case-locked .selection-card:hover .smoke-layer {
            opacity: 0;
        }
        .selection-grid.case-locked .selection-card:hover .case-card-image {
            border-color: rgba(255,255,255,0.06);
            box-shadow: none;
        }
        .selection-grid.case-locked .selection-card:hover .case-card-image img {
            opacity: 0.75;
            transform: none;
        }
        .selection-grid.case-locked .selection-card.selected:hover {
            opacity: 1;
            filter: brightness(1) saturate(1);
            border-color: var(--society-gold);
            background: var(--bg-elevated);
            box-shadow: 0 0 0 1px var(--society-gold), 0 0 20px rgba(197, 160, 89, 0.25), 0 8px 30px rgba(0, 0, 0, 0.4);
        }
        .selection-grid.case-locked .selection-card.selected:hover::before {
            transform: scaleX(1);
        }
        .selection-grid.case-locked .selection-card.selected:hover::after {
            opacity: 0.5;
        }
        .selection-grid.case-locked .selection-card.selected:hover .case-card-image img {
            opacity: 1;
        }

        /* Colorway selector — elegant pill selector */
        .colorway-selector {
            display: flex;
            justify-content: center;
            gap: 0.5rem;
            margin-top: 1rem;
            flex-wrap: wrap;
        }
        .colorway-pill {
            display: flex;
            align-items: center;
            gap: 0.4rem;
            padding: 0.4rem 0.8rem;
            border-radius: 20px;
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.08);
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 0.75rem;
            color: var(--text-secondary);
        }
        .colorway-pill:hover {
            border-color: var(--border-glow);
            background: rgba(255,255,255,0.06);
            color: var(--text-primary);
        }
        .colorway-pill.selected {

        default: `<svg viewBox="0 0 60 120" class="case-silhouette" xmlns="http://www.w3.org/2000/svg">

    // Map case IDs to silhouette keys
    const caseSilhouetteMap = {
        'a18-aramid': 'aramid',
        'a18-ultra-aramid': 'foldable_wide',
        'a18-shockproof': 'shockproof',
        'a18-vegan-leather': 'leather',
        'a18-frosted': 'frosted',
        'a18-ghost-lumen': 'ghost',
        'a18-rugged': 'rugged',
        'a17-aramid': 'aramid',
        'a17-shockproof': 'shockproof',
        'a17-vegan-leather': 'leather',
        'a17-frosted': 'frosted',
        'a17-rugged': 'rugged',
        'sf8-aramid': 'foldable',
        'sf8w-aramid': 'foldable_wide',
        's26-aramid': 'aramid',
        's26-frosted': 'frosted',
    };

    function getCaseSilhouette(caseId) {
        const key = caseSilhouetteMap[caseId] || 'default';
        return caseSilhouettes[key] || caseSilhouettes.default;
    }
    const bubble = document.getElementById('ai-bubble');
    const orbitContainer = document.getElementById('orbit-container');
    const prompt = document.getElementById('stage-prompt');
    const subtitle = document.getElementById('stage-subtitle');
    const grid = document.getElementById('selection-grid');
    const deviceRender = document.getElementById('device-render');
    const phoneMockup = document.getElementById('phone-mockup');
    const caseOverlay = document.getElementById('case-overlay');
    const btnNext = document.getElementById('btn-next');
    const btnBack = document.getElementById('btn-back');
    const summary = document.getElementById('summary');
    const nfcPulse = document.getElementById('nfc-pulse');

    // Render step
    function renderStep(step) {
        const data = stepData[step];
        prompt.style.opacity = '0';
        subtitle.style.opacity = '0';

        setTimeout(() => {
            prompt.textContent = data.prompt;
            subtitle.textContent = data.subtitle;
            prompt.style.opacity = '1';
            subtitle.style.opacity = '1';
        }, 300);

        // Reset bubble to orb
        bubble.className = 'ai-bubble';
        bubble.querySelector('.ai-bubble-mark').textContent = 'S';

        // Clear grid
        grid.innerHTML = '';
        grid.style.display = 'grid';
        deviceRender.style.display = 'none';
        summary.classList.remove('visible');

        // Remove step2 split layout if exiting step 2
        const existingLayout = document.querySelector('.step2-layout');
        if (existingLayout && step !== 2) {
            // Move grid back out of the layout
            const gridSide = existingLayout.querySelector('.step2-grid-side');
            if (gridSide && grid.parentElement === gridSide) {
                existingLayout.parentElement.insertBefore(grid, existingLayout);
            }
            existingLayout.remove();
        }

        // Update steps
        const hasCases = deviceHasCases(selections.device?.id);
        for (let i = 1; i <= 4; i++) {
            const stepEl = document.getElementById(`step-${i}`);
            stepEl.classList.remove('active', 'completed', 'skipped');
            // If device has no cases, step 2 is visually skipped
            if (!hasCases && i === 2) {
                stepEl.classList.add('skipped');
            } else if (i < step) {
                stepEl.classList.add('completed');
            } else if (i === step) {
                stepEl.classList.add('active');
            }
        }
        for (let i = 1; i <= 3; i++) {
            const line = document.getElementById(`line-${i}`);
            // If step 2 is skipped, treat line-1 and line-2 as completed when past step 2
            if (!hasCases && i <= 2) {
                line.classList.toggle('completed', step > 2);
            } else {
                line.classList.toggle('completed', i < step);
            }
        }

        // Render options
        data.options.forEach(opt => {
            const card = document.createElement('div');
            card.className = 'selection-card';
            card.dataset.id = opt.id;

            const iconHTML = getLogoHTML(opt.logo || opt.type);
            // Show silhouettes on step 1 for foldable devices, and step 2 for all cases
            const showSilhouette = (step === 2 && opt.id) || (step === 1 && (opt.type === 'foldable' || opt.type === 'foldable-wide' || opt.type === 'foldable-horizontal'));
            let silhouetteHTML = '';
            if (step === 2 && opt.id) {
                silhouetteHTML = getCaseSilhouette(opt.id);
            } else if (step === 1 && opt.type === 'foldable') {
                silhouetteHTML = caseSilhouettes.foldable;
            } else if (step === 1 && opt.type === 'foldable-wide') {
                silhouetteHTML = caseSilhouettes.foldable_wide;
            } else if (step === 1 && opt.type === 'foldable-horizontal') {
                silhouetteHTML = caseSilhouettes.foldable_horizontal;
            }

            const caseImgSrc = (step === 2 && caseImageMap[opt.id]) ? caseImageMap[opt.id] : null;
            const caseImgHTML = caseImgSrc ? `<div class="case-card-image"><img src="${caseImgSrc}" alt="${opt.label}" /></div>` : '';
            card.innerHTML = `
                <div class="smoke-layer">
                    <div class="smoke-particle"></div>
                    <div class="smoke-particle"></div>
                    <div class="smoke-particle"></div>
                </div>
                ${caseImgHTML || iconHTML + silhouetteHTML}
                <div class="card-title">${opt.label}</div>
                <div class="card-subtitle">${opt.subtitle}</div>
            `;

            card.addEventListener('click', () => selectOption(step, opt, card));
            // Step 2: live preview on hover — ONLY when no case is selected yet
            if (step === 2) {
                card.addEventListener('mouseenter', () => {
                    // Locked once a case is selected — no hover changes
                    if (window.__caseLocked) return;
                    if (!card.classList.contains('selected')) {
                        renderCaseInPreview(opt);
                    }
                });
                card.addEventListener('mouseleave', () => {
                    // Locked once a case is selected — no morphing back
                    if (window.__caseLocked) return;
                    if (!card.classList.contains('selected')) {
                        morphPhoneBack();
                    }
                });
            }
            grid.appendChild(card);
        });

        // Step 2: filter cases by selected phone and show split layout
        if (step === 2) {
            const deviceId = selections.device ? selections.device.id : null;
            const compatibleSeries = deviceId ? (phoneCaseMap[deviceId] || []) : [];
            const compatibleCaseIds = new Set();
            compatibleSeries.forEach(s => (caseSeriesMap[s] || []).forEach(id => compatibleCaseIds.add(id)));

            // Filter grid cards — hide incompatible cases
            if (compatibleCaseIds.size > 0) {
                grid.querySelectorAll('.selection-card').forEach(card => {
                    if (compatibleCaseIds.has(card.dataset.id)) {
                        card.style.display = '';
                    } else {
                        card.style.display = 'none';
                    }
                });
            }

            // Apply featured styling when only one case option is available
            const gridSide = document.querySelector('.step2-grid-side');
            if (gridSide) {
                if (compatibleCaseIds.size === 1) {
                    gridSide.classList.add('has-single-case');
                } else {
                    gridSide.classList.remove('has-single-case');
                }
            }

            // Build split layout: grid on left, preview on right
            const contentEl = document.querySelector('.content');
            let layout = contentEl.querySelector('.step2-layout');
            if (!layout) {
                layout = document.createElement('div');
                layout.className = 'step2-layout';
                // Move grid into left side
                const gridParent = grid.parentElement;
                gridParent.insertBefore(layout, grid);
                const gridSide = document.createElement('div');
                gridSide.className = 'step2-grid-side';
                gridSide.appendChild(grid);
                layout.appendChild(gridSide);

                // Build preview panel on right
                const previewSide = document.createElement('div');
                previewSide.className = 'step2-preview-side';
                previewSide.innerHTML = `
                    <div class="case-preview-panel" id="case-preview-panel">
                        <div class="case-preview-phone-label">Your Device</div>
                        <div class="case-preview-phone-name" id="case-preview-phone-name">—</div>
                        <div class="case-preview-device-area" id="case-preview-device-area"></div>
                        <div class="case-preview-info" id="case-preview-info">
                            <div class="case-preview-hint">Hover or tap a case to preview</div>
                        </div>
                    </div>
                `;
                layout.appendChild(previewSide);
            }

            // Show phone in preview
            grid.style.display = 'grid';
            if (selections.device) {
                document.getElementById('case-preview-phone-name').textContent = selections.device.label;
                renderPhoneInPreview(selections.device);
                if (selections.case) {
                    renderCaseInPreview(selections.case);
                } else if (compatibleCaseIds.size === 1) {
                    // Auto-select and preview the single available case
                    const onlyCaseId = [...compatibleCaseIds][0];
                    const onlyCase = data.options.find(o => o.id === onlyCaseId);
                    if (onlyCase) {
                        const onlyCard = grid.querySelector(`[data-id="${onlyCaseId}"]`);
                        if (onlyCard) onlyCard.classList.add('selected');
                        selections.case = onlyCase;
                        renderCaseInPreview(onlyCase);
                        btnNext.disabled = false;
                    }
                }
            }
        }

        // Reset selection state
        btnNext.disabled = !isStepComplete(step);
        btnBack.style.display = step > 1 ? 'inline-flex' : 'none';

        // Last step — show summary if complete
        if (step === 4 && selections.membership) {
            showSummary();
        }
    }

    function selectOption(step, opt, card) {
        // Deselect siblings
        grid.querySelectorAll('.selection-card').forEach(c => c.classList.remove('selected'));
        card.classList.add('selected');

        // Store selection
        if (step === 1) selections.device = opt;
        if (step === 2) { selections.case = opt; window.__caseLocked = true; document.getElementById('selection-grid').classList.add('case-locked'); }
        if (step === 3) selections.wallet = opt;
        if (step === 4) selections.membership = opt;

        // Morph the bubble
        morphBubble(step, opt);

        // Show device render for device selection
        if (step === 1) {
            showDeviceRender(opt);
        }
        if (step === 2) {
            renderCaseInPreview(opt);
        }
        if (step === 3 && opt.type === 'tangem') {
            triggerNFCAnimation();
        }

        btnNext.disabled = false;

        if (step === 4) {
            showSummary();
        }
    }

    function morphBubble(step, opt) {
        bubble.className = 'ai-bubble';

        if (step === 1) {
            // Morph to phone shape
            bubble.classList.add('morphed-phone');
            bubble.querySelector('.ai-bubble-mark').innerHTML = logos[opt.logo] ? logos[opt.logo].replace(/width="\d+"/, 'width="24"').replace(/height="\d+"/, 'height="24"') : '✓';
        } else if (step === 2) {
            bubble.classList.add('morphed-case');
            // Color the bubble based on case type
            if (opt.type === 'magsafe') {
                bubble.style.boxShadow = '0 0 60px var(--society-gold-glow), inset 0 0 40px rgba(197, 160, 89, 0.08)';
            } else if (opt.type === 'raven-gold') {
                bubble.style.boxShadow = '0 0 60px var(--society-gold-glow-2), inset 0 0 40px rgba(197, 160, 89, 0.08)';
            } else if (opt.type === 'clear') {
                bubble.style.boxShadow = '0 0 60px var(--society-green-glow), inset 0 0 40px rgba(42, 138, 94, 0.08)';
            } else if (opt.type === 'leather') {
                bubble.style.boxShadow = '0 0 60px rgba(74, 58, 42, 0.2), inset 0 0 40px rgba(74, 58, 42, 0.08)';
            }
            bubble.querySelector('.ai-bubble-mark').textContent = '✓';
        } else if (step === 3) {
            bubble.querySelector('.ai-bubble-mark').innerHTML = logos[opt.logo] ? logos[opt.logo].replace(/width="\d+"/, 'width="32"').replace(/height="\d+"/, 'height="32"') : '✓';
        } else if (step === 4) {
            bubble.querySelector('.ai-bubble-mark').innerHTML = logos[opt.logo] ? logos[opt.logo].replace(/width="\d+"/, 'width="32"').replace(/height="\d+"/, 'height="32"') : '✓';
            if (opt.id === 'founding-nodes') {
                bubble.style.boxShadow = '0 0 60px var(--society-gold-glow-2), inset 0 0 40px rgba(197, 160, 89, 0.08)';
            }
        }
    }

    // ── Step 2 preview functions ──
    function renderPhoneInPreview(deviceOpt) {
        const area = document.getElementById('case-preview-device-area');
        if (!area) return;

        const isFoldable = deviceOpt.type === 'foldable' || deviceOpt.type === 'foldable-wide' || deviceOpt.type === 'foldable-horizontal';
        const isHorizontal = deviceOpt.type === 'foldable-horizontal';
        const isWide = deviceOpt.type === 'foldable-wide';

        // Build the phone mockup HTML
        let phoneHTML = '';
        if (isFoldable) {
            const mockupClass = isHorizontal ? 'foldable-horizontal' : (isWide ? 'foldable-wide' : 'foldable');
            phoneHTML = `<div class="phone-mockup foldable-interactive ${mockupClass} fold-open" style="opacity:1; transform:scale(0.75); cursor:default;">`;
            if (isHorizontal) {
                phoneHTML += `
                    <div class="fold-half fold-top-half"><div class="fold-screen"></div></div>
                    <div class="fold-crease-line fold-crease-horizontal"></div>
                    <div class="fold-half fold-bottom-half"><div class="fold-screen"></div></div>`;
            } else {
                phoneHTML += `
                    <div class="fold-half fold-left-half"><div class="fold-screen"></div></div>
                    <div class="fold-crease-line fold-crease-vertical"></div>
                    <div class="fold-half fold-right-half"><div class="fold-screen"></div></div>`;
            }
            phoneHTML += `</div>`;
        } else {
            phoneHTML = `<div class="phone-mockup screen-on" style="opacity:1; transform:scale(0.85);">

    function renderCaseInPreview(caseOpt) {
        const area = document.getElementById('case-preview-device-area');
        if (!area) return;

        const phoneLayer = area.querySelector('.morph-phone');
        const caseLayer = area.querySelector('.morph-case');
        const flash = area.querySelector('.morph-flash');
        
        if (!phoneLayer || !caseLayer) return;

        const imgSrc = caseImageMap[caseOpt.id] || caseImageMap['a18-aramid'];

        // Load the case image into the case layer
        caseLayer.style.display = 'block';
        caseLayer.innerHTML = `<img src="${imgSrc}" alt="${caseOpt.label}" />`;

        // Trigger the morph: phone shrinks & rotates out, case image grows & rotates in
        phoneLayer.classList.add('morphing-out');
        caseLayer.classList.remove('morphing-in');
        
        // Flash effect at midpoint
        if (flash) {
            flash.classList.remove('active');
            flash.offsetWidth; // reflow
            flash.classList.add('active');
        }
        
        // After a tiny delay, morph case in
        setTimeout(() => {
            caseLayer.classList.add('morphing-in');
        }, 100);

        // Update info panel with case details + colorway selector
        const info = document.getElementById('case-preview-info');
        const panel = document.getElementById('case-preview-panel');
        if (info) {
            const colors = caseColors[caseOpt.id] || [];
            let colorwayHTML = '';
            if (colors.length > 1) {
                colorwayHTML = '<div class="colorway-selector">';
                colors.forEach((c, i) => {
                    colorwayHTML += `<div class="colorway-pill${i === 0 ? ' selected' : ''}" data-color="${c.name}" data-hex="${c.hex}"><div class="colorway-dot" style="background:${c.hex}"></div>${c.name}</div>`;
                });
                colorwayHTML += '</div>';
            }

            info.innerHTML = `
                <div class="case-preview-case-name">${caseOpt.label}</div>
                <div class="case-preview-lifestyle">${caseOpt.lifestyle || ''}</div>
                <div class="case-preview-price" style="color: var(--accent-green);">${caseOpt.subtitle}</div>
                ${colorwayHTML}
            `;
            
            // Wire up colorway pills — swap to actual color variant photo
            info.querySelectorAll('.colorway-pill').forEach(pill => {
                pill.addEventListener('click', function() {
                    info.querySelectorAll('.colorway-pill').forEach(p => p.classList.remove('selected'));
                    this.classList.add('selected');
                    
                    const colorName = this.dataset.color;
                    const img = caseLayer.querySelector('img');
                    if (!img) return;
                    
                    // Find the real color variant photo
                    const colorImages = caseColorImageMap[caseOpt.id] || {};
                    const newSrc = colorImages[colorName];
                    
                    if (newSrc) {
                        // Real photo swap — fade out, change src, fade in
                        img.classList.add('swapping');
                        setTimeout(() => {
                            img.src = newSrc;
                            img.style.filter = '';
                            img.classList.remove('swapping');
                        }, 200);
                    }
                });
            });
        }
        if (panel) panel.classList.add('has-case');
    }
    
    // When going back to phone view (un-hovering), morph phone back in
    function morphPhoneBack() {
        const area = document.getElementById('case-preview-device-area');
        if (!area) return;
        const phoneLayer = area.querySelector('.morph-phone');
        const caseLayer = area.querySelector('.morph-case');
        if (!phoneLayer || !caseLayer) return;
        
        caseLayer.classList.remove('morphing-in');
        phoneLayer.classList.remove('morphing-out');
    }

    function showDeviceRender(opt) {
        grid.style.display = 'none';
        deviceRender.style.display = 'flex';

        // For foldables: build an interactive foldable mockup with open/close toggle
        if (opt.type === 'foldable' || opt.type === 'foldable-wide' || opt.type === 'foldable-horizontal') {
            const isHorizontal = opt.type === 'foldable-horizontal';
            const isWide = opt.type === 'foldable-wide';
            const mockupClass = isHorizontal ? 'foldable-horizontal' : (isWide ? 'foldable-wide' : 'foldable');

            phoneMockup.className = 'phone-mockup foldable-interactive ' + mockupClass;
            phoneMockup.classList.add('fold-closed');

            if (isHorizontal) {
                phoneMockup.innerHTML = `
                    <div class="fold-half fold-top-half"><div class="fold-screen fold-screen-top"></div></div>
                    <div class="fold-crease-line fold-crease-horizontal"></div>
                    <div class="fold-half fold-bottom-half"><div class="fold-screen fold-screen-bottom"></div></div>
                    <div class="fold-hint">Tap to unfold</div>
                `;
            } else {
                phoneMockup.innerHTML = `
                    <div class="fold-half fold-left-half"><div class="fold-screen fold-screen-left"></div></div>
                    <div class="fold-crease-line fold-crease-vertical"></div>
                    <div class="fold-half fold-right-half"><div class="fold-screen fold-screen-right"></div></div>
                    <div class="fold-hint">Tap to open</div>
                `;
            }

            phoneMockup.onclick = function() {
                phoneMockup.classList.toggle('fold-closed');
                phoneMockup.classList.toggle('fold-open');
                const hint = phoneMockup.querySelector('.fold-hint');
                if (hint) hint.textContent = phoneMockup.classList.contains('fold-open') ? 'Tap to close' : 'Tap to open';
            };

            phoneMockup.classList.add('screen-on');
            setTimeout(() => {
                phoneMockup.style.opacity = '1';
                phoneMockup.style.transform = 'scale(1)';
            }, 100);
            return;
        }

        // Standard phone mockup (non-foldable)
        phoneMockup.className = 'phone-mockup';
        phoneMockup.classList.add('screen-on');
        phoneMockup.innerHTML = `
            <div class="phone-notch"></div>
            <div class="phone-screen" style="width: 80%;">
                <div class="phone-screen-content">
                    <div style="font-size: 0.7rem; color: var(--text-tertiary);">${opt.label}</div>
                </div>
            </div>
        `;
        setTimeout(() => {
            phoneMockup.style.opacity = '1';
            phoneMockup.style.transform = 'scale(1)';
        }, 100);
    }

    function triggerNFCAnimation() {
        nfcPulse.className = 'nfc-pulse';
        nfcPulse.offsetWidth; // reflow
        nfcPulse.classList.add('active');

        // Multiple pulse rings
        setTimeout(() => {
            nfcPulse.classList.remove('active');
            nfcPulse.offsetWidth;
            nfcPulse.classList.add('active');
        }, 500);
    }

    // Check if the selected device has any compatible cases
    function deviceHasCases(deviceId) {
        if (!deviceId) return false;
        const series = phoneCaseMap[deviceId] || [];
        return series.some(s => (caseSeriesMap[s] || []).length > 0);
    }

    function isStepComplete(step) {
        if (step === 1) return selections.device !== null;
        if (step === 2) return selections.case !== null;
        if (step === 3) return selections.wallet !== null;
        if (step === 4) return selections.membership !== null;
        return false;
    }

    function showSummary() {
        summary.classList.add('visible');
        document.getElementById('sum-device').textContent = selections.device?.label || '—';
        document.getElementById('sum-case').textContent = selections.case?.label || (deviceHasCases(selections.device?.id) ? '—' : 'No case available');
        document.getElementById('sum-wallet').textContent = selections.wallet?.label || '—';
        document.getElementById('sum-membership').textContent = selections.membership?.label || '—';

        // Change button to gold if founding member
        if (selections.membership?.id === 'founding-nodes') {
            btnNext.className = 'btn btn-gold';
            btnNext.textContent = 'Claim Your NODE →';
        }
    }

    function goNext() {
        if (currentStep < 4) {
            currentStep++;
            // Skip step 2 (case selection) if device has no compatible cases
            if (currentStep === 2 && !deviceHasCases(selections.device?.id)) {
                selections.case = null; // ensure no stale case
                currentStep = 3;
            }
            renderStep(currentStep);
        } else {
            // Complete — would redirect to payment
            alert('SocietyOS setup complete! Welcome to the Society.');
        }
    }

    function goBack() {
        if (currentStep > 1) {
            currentStep--;
            // Skip step 2 when going back if device has no compatible cases
            if (currentStep === 2 && !deviceHasCases(selections.device?.id)) {
                currentStep = 1;
            }
            // Unlock hover when returning to step 2
            if (currentStep === 2) {
                window.__caseLocked = false;
                document.getElementById('selection-grid')?.classList.remove('case-locked');
            }
            renderStep(currentStep);
        }
    }

    // Init
    renderStep(1);
</script>

</body>
